<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArthaDisha Client Invoice</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="invoice">
        <header class="company-header">
            <div class="logo-placeholder">AD</div>
            <div>
                <h1>ARTHADISHA</h1>
                <p>IT SERVICES &amp; Supplies</p>
                <p>Nashik, Maharashtra, India</p>
            </div>
        </header>

        <div class="page-heading">
            <h2>Client Invoice</h2>
            <div class="actions no-print">
                <button type="button" id="print-invoice">Print Invoice</button>
                <button type="button" id="download-pdf" class="secondary">Download PDF</button>
            </div>
        </div>

        <div class="details">
            <label>Invoice Number
                <input id="invoice-number" type="text" value="INV-001">
            </label>
            <label>Invoice Date
                <input type="date" id="invoice-date">
            </label>
            <label>Client Name
                <input id="client-name" type="text" placeholder="Enter client name">
            </label>
            <label>Client Email
                <input id="client-email" type="email" placeholder="Enter email">
            </label>
            <label>Country
                <select id="client-country">
                    <option value="India">India</option>
                    <option value="Other">Other</option>
                </select>
            </label>
            <label>State
                <select id="client-state">
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Goa">Goa</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Other">Other State</option>
                </select>
            </label>
            <label class="full-width">Client Address
                <textarea id="client-address" placeholder="Enter client address"></textarea>
            </label>
        </div>

        <h3>Invoice Items</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Rate (₹)</th>
                        <th>Amount (₹)</th>
                    </tr>
                </thead>
                <tbody id="invoice-items"></tbody>
            </table>
        </div>

        <section class="tax-settings no-print">
            <h3>Tax Settings</h3>
            <div id="gst-settings">
                <label for="gst-rate">GST Rate (%) — CGST + SGST</label>
                <select id="gst-rate"></select>
            </div>
            <div id="igst-settings" hidden>
                <label for="igst-rate">IGST Rate (%)</label>
                <select id="igst-rate"></select>
            </div>
            <p id="tax-mode">Tax type: CGST + SGST</p>
        </section>

        <section class="totals">
            <p><span>Subtotal</span><strong id="subtotal">₹0.00</strong></p>
            <p id="cgst-row">
                <span id="cgst-label">CGST (9%)</span>
                <strong id="cgst">₹0.00</strong>
            </p>
            <p id="sgst-row">
                <span id="sgst-label">SGST (9%)</span>
                <strong id="sgst">₹0.00</strong>
            </p>
            <p id="igst-row" hidden>
                <span id="igst-label">IGST (18%)</span>
                <strong id="igst">₹0.00</strong>
            </p>
            <p class="grand-total">
                <span>Grand Total</span>
                <strong id="grand-total">₹0.00</strong>
            </p>
        </section>

        <footer>Thank you for your business</footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
